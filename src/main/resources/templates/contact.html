<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Contact | gadam7</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/main.css">
    <style>

    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-person-circle me-2"></i>
            gadam7 - Portfolio
        </a>
        <div class="d-flex gap-1">
            <a class="nav-link text-white px-3" href="/"><i class="bi bi-house-fill me-1"></i> Home</a>
            <a class="nav-link text-white px-3" href="/about"><i class="bi bi-info-circle-fill me-1"></i> About</a>
            <a class="nav-link text-white px-3" href="/projects"><i class="bi bi-journal-code me-1"></i> Projects</a>
            <a class="nav-link text-white px-3" href="/contact"><i class="bi bi-envelope-fill me-1"></i> Contact</a>
        </div>
    </div>
</nav>
<main>
    <div class="contact-card">
        <img src="/img/photo.jpg" class="contact-avatar mx-auto d-block" alt="George" style="width:80px;">
        <h2 class="text-center mb-3">Let's Connect</h2>
        <div class="text-center mb-3">
            <a href="https://github.com/gadam7" target="_blank" class="btn btn-dark btn-sm mx-1 blink-hard">
                <i class="bi bi-github"></i>
            </a>
            <a href="https://linkedin.com/in/YOUR_LINKEDIN" target="_blank" class="btn btn-dark btn-sm mx-1 blink-hard">
                <i class="bi bi-linkedin"></i>
            </a>
            <a href="mailto:g.adamidis1985@gmail.com" class="btn btn-dark btn-sm mx-1 blink-hard">
                <i class="bi bi-envelope"></i>
            </a>
        </div>
        <hr>
        <form
                th:action="@{/contact}"
                th:object="${contactForm}"
                method="post">
            <div class="mb-3">
                <label for="inputName" class="form-label">Your Name</label>
                <input type="text" th:field="*{name}" class="form-control" id="inputName" placeholder="e.g. Joe Doe">
            </div>
            <div class="mb-3">
                <label for="inputEmail" class="form-label">Your Email</label>
                <input type="email" th:field="*{email}" class="form-control" id="inputEmail" placeholder="you@example.com">
            </div>
            <div class="mb-3">
                <label for="inputMessage" class="form-label">Message</label>
                <textarea class="form-control" th:field="*{message}" id="inputMessage" rows="3" placeholder="Say hi or ask a question!"></textarea>
            </div>
            <button type="submit" class="btn btn-dark w-100">Send Message</button>
        </form>
        <div th:if="${success}" class="alert alert-success mt-3">
            Thank you for your message! I'll reply soon.
        </div>
        <div class="text-muted mt-3" style="font-size:.95em;">I'll get back to you as soon as possible.</div>
    </div>
</main>
<footer class="text-center mt-5 text-secondary">
    &copy; 2025 gadam7
</footer>
</body>
</html>
